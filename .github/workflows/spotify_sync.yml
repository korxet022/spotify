name: Sincronizar Spotify con Supabase

on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta automáticamente cada hora en punto
  workflow_dispatch: # Permite lanzarlo manualmente cuando quieras desde la web de GitHub

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          pip install spotipy supabase

      - name: Restaurar archivo .cache de Spotify desde los secretos
        run: |
          echo '${{ secrets.SPOTIPY_CACHE }}' > .cache

      - name: Ejecutar script de sincronización
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python spoty.py
